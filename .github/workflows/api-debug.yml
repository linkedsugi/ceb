name: API Debug (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe YouVersion API
        run: |
          KEY="qbm8XmKaOzIz13aHVCrcgd9vfWAfRr6Ge6LoPV8w5i7NaLLf"
          H1="X-YVP-App-Key: $KEY"
          H2="X-YVP-Installation-Id: ceb-web-app"
          H3="Accept: application/json"

          probe () {
            echo "=== $1"
            curl -sS -o body.txt -w "status=%{http_code} content-type=%{content_type} size=%{size_download}\n" \
              -H "$H1" -H "$H2" -H "$H3" "$1" || true
            head -c 900 body.txt; echo; echo "---"
          }

          probe "https://api.youversion.com/v1/bibles"
          probe "https://api.youversion.com/v1/bibles?language_ranges%5B%5D=en"
          probe "https://api.youversion.com/v1/bibles?language_ranges%5B%5D=en%2A"
          probe "https://api.youversion.com/v1/bibles?language_ranges%5B%5D=en-US"
          probe "https://api.youversion.com/v1/bibles?language_ranges%5B%5D=eng"
          probe "https://api.youversion.com/v1/bibles?language_ranges%5B%5D=%2A"
          probe "https://api.youversion.com/v1/bibles/1"
          probe "https://api.youversion.com/v1/bibles/3034"
          probe "https://api.youversion.com/v1/bibles/111"
          probe "https://api.youversion.com/v1/bibles/59"
          probe "https://api.youversion.com/v1/verse_of_the_days/1"
