name: API Debug Probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe YouVersion catalog
        env:
          KEY: qbm8XmKaOzIz13aHVCrcgd9vfWAfRr6Ge6LoPV8w5i7NaLLf
        run: |
          hdr=(-H "X-YVP-App-Key: $KEY" -H "X-YVP-Installation-Id: ceb-web-app" -H "Accept: application/json")
          base="https://api.youversion.com/v1"

          echo "=== English catalog ==="
          curl -s "${hdr[@]}" "$base/bibles?language_ranges%5B%5D=en&page_size=99" \
            | jq -r '.data[]? | "\(.id)\t\(.abbreviation)\t\(.title)"'

          for lang in heb he hbo grc el es fr de zh ja ko la; do
            echo "=== Catalog: $lang ==="
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" "${hdr[@]}" "$base/bibles?language_ranges%5B%5D=$lang&page_size=99")
            echo "HTTP $code"
            if [ "$code" = "200" ]; then
              jq -r '.data[]? | "\(.id)\t\(.abbreviation)\t\(.title)"' /tmp/out.json
            fi
          done

          echo "=== Direct ID checks ==="
          # 59 ESV, 110 NIRV, 114 NKJV, 97 MSG, 1588 AMP, 1713 CSB, 2016 NRSV,
          # 68/69 GNT, 12 ASV, 2218? WLC, 111 NIV(control), 116 NLT(known 404), 37 CEB(known 404)
          for id in 59 110 114 97 1588 1713 2016 68 69 12 111 116 37; do
            code=$(curl -s -o /tmp/v.json -w "%{http_code}" "${hdr[@]}" "$base/bibles/$id")
            title=$(jq -r '.title // .abbreviation // empty' /tmp/v.json 2>/dev/null)
            echo "id=$id HTTP $code $title"
          done

          echo "=== Passage smoke tests (JHN.3 or GEN.1) ==="
          for id in 59 110 114 1713; do
            code=$(curl -s -o /tmp/p.json -w "%{http_code}" "${hdr[@]}" "$base/bibles/$id/passages/JHN.3?format=html&include_headings=false&include_notes=false")
            len=$(wc -c < /tmp/p.json)
            echo "passage id=$id HTTP $code bytes=$len"
          done
