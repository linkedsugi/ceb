name: API Debug (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find CEB in full YouVersion catalog
        run: |
          KEY="qbm8XmKaOzIz13aHVCrcgd9vfWAfRr6Ge6LoPV8w5i7NaLLf"
          H1="X-YVP-App-Key: $KEY"
          H2="X-YVP-Installation-Id: ceb-web-app"

          TOKEN=""
          for i in $(seq 1 15); do
            URL="https://api.youversion.com/v1/bibles?language_ranges%5B%5D=en&page_size=99&all_available=true"
            [ -n "$TOKEN" ] && URL="$URL&page_token=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$TOKEN")"
            STATUS=$(curl -sS -o page.json -w "%{http_code}" -H "$H1" -H "$H2" "$URL")
            echo "page $i status=$STATUS count=$(jq '.data | length' page.json 2>/dev/null || echo '?')"
            if [ "$STATUS" != "200" ]; then head -c 300 page.json; echo; break; fi
            jq -c '.data[] | select((.title|test("Common English";"i")) or (.abbreviation=="CEB") or (.localized_abbreviation=="CEB")) | {id,abbreviation,title,organization_id}' page.json
            jq -c '.data[] | select(.abbreviation|test("CEB";"i")) | {id,abbreviation,title,organization_id}' page.json
            TOKEN=$(jq -r '.next_page_token // empty' page.json)
            [ -z "$TOKEN" ] && echo "(no more pages)" && break
          done

          echo "=== direct 37 with all_available context ==="
          curl -sS -o v37.json -w "status=%{http_code}\n" -H "$H1" -H "$H2" "https://api.youversion.com/v1/bibles/37?all_available=true"
          head -c 400 v37.json; echo

      - name: Resolve organization name if CEB found
        run: |
          KEY="qbm8XmKaOzIz13aHVCrcgd9vfWAfRr6Ge6LoPV8w5i7NaLLf"
          ORG=$(jq -r '.organization_id // empty' v37.json 2>/dev/null || true)
          echo "org_id=$ORG"
          if [ -n "$ORG" ]; then
            curl -sS -H "X-YVP-App-Key: $KEY" "https://api.youversion.com/v1/organizations/$ORG" | head -c 600; echo
          fi
